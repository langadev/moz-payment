name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Lint — checkstyle via Maven (compile phase catches most issues)
        run: ./mvnw validate --no-transfer-progress

      - name: Run unit tests
        run: ./mvnw test --no-transfer-progress -Dtest="PaymentServiceTest" -DfailIfNoTests=false

      - name: Run integration tests (Testcontainers)
        run: ./mvnw verify --no-transfer-progress -Dtest="PaymentIntegrationTest" -DfailIfNoTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  docker:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (for Maven package)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Build Docker image
        run: docker build -t payment-service:${{ github.sha }} .

      - name: Validate container starts
        run: |
          docker run -d --name test-container \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/test \
            -e SPRING_DATASOURCE_USERNAME=test \
            -e SPRING_DATASOURCE_PASSWORD=test \
            -e RABBITMQ_HOST=localhost \
            payment-service:${{ github.sha }} || true
          sleep 5
          docker logs test-container 2>&1 | head -30
          docker rm -f test-container || true

  api-validation:
    name: API Contract Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: payment_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Start application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment_db
          SPRING_DATASOURCE_USERNAME: payment_user
          SPRING_DATASOURCE_PASSWORD: payment_secret
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
        run: |
          java -jar target/*.jar &
          echo $! > app.pid
          echo "Waiting for app to start..."
          for i in {1..30}; do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 3
          done

      - name: Validate POST /api/v1/payments
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8080/api/v1/payments \
            -H "Content-Type: application/json" \
            -d '{"idempotencyKey":"ci-test-001","amount":100.00,"currency":"MZN","phoneNumber":"+258840000000","description":"CI test"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"PENDING"'
          PAYMENT_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "PAYMENT_ID=$PAYMENT_ID" >> $GITHUB_ENV

      - name: Validate GET /api/v1/payments/{id}
        run: |
          curl -sf http://localhost:8080/api/v1/payments/${{ env.PAYMENT_ID }} | grep -q '"status"'

      - name: Validate idempotency (duplicate key returns 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/v1/payments \
            -H "Content-Type: application/json" \
            -d '{"idempotencyKey":"ci-test-001","amount":100.00,"currency":"MZN","phoneNumber":"+258840000000","description":"CI test"}')
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS" && exit 1)

      - name: Validate 404 for unknown payment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/payments/00000000-0000-0000-0000-000000000000)
          [ "$STATUS" = "404" ] || (echo "Expected 404, got $STATUS" && exit 1)

      - name: Stop application
        if: always()
        run: kill $(cat app.pid) || true
